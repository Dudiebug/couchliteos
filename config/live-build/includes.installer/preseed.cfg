# Loaded by the Debian installer from its initrd (live-build copies includes.installer there).
#
# The installed box needs no login account of its own: it starts the launcher as the
# `couchliteos` user (uid 1000, already in the image), tty1 is the launcher, and no SSH
# server is installed. So the installer does not ask for a user name or passwords, rather
# than asking for an account nobody can use (in 0.2.x the answers made no account at all).
# The installer cannot leave both questions out with root login off, so root login stays
# "on" with a password hash nothing matches: nobody can log in as root, as before. It must
# be `*`, not `!`: user-setup-ask takes "!" for "no hash preseeded" and asks for a password.
d-i passwd/make-user boolean false
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password *
