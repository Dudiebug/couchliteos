# MoonlightOS nvidia profile: Cage/wlroots needs kernel modesetting (GBM).
# fbdev=1 replaces the firmware framebuffer console once the driver loads.
options nvidia-current-drm modeset=1 fbdev=1
# Sleep and wake: keep video memory across suspend. NVIDIA's suspend and resume
# services (nvidia-suspend-common) save it under /var/tmp. Debian's module is
# nvidia-current (nvidia is its alias), and options only apply to the name the
# module is loaded by, so both are set; nvidia-current also covers the load as
# a dependency of nvidia-current-drm.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
options nvidia-current NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
