# CouchLiteOS build profile: nvidia (release ISO for GeForce GTX 900 to RTX 40).
# Everything in the general profile plus NVIDIA's proprietary 550 driver,
# built with DKMS for the image kernel. couchliteos-hwdetect loads it only for
# GPUs on the driver's supported list (/usr/share/nvidia/nvidia.ids) and falls
# back to nouveau for older cards (Kepler, including the iMac Late 2013) and
# for the Basic Graphics boot entry (couchliteos.gpu=basic).
PROFILE_NAME=nvidia
PROFILE_DESCRIPTION="NVIDIA: GeForce GTX 900 to RTX 40 with the proprietary 550 driver"
# Package lists, hooks, and overlay files of this profile are added on top of
# the base profile's (build/configure.sh).
PROFILE_BASE=general
ISO_SUFFIX=nvidia
RELEASE=1
NVIDIA_DRIVER=proprietary
LB_EXTRA_CONFIG='--firmware-binary false --firmware-chroot false'
REQUIRED_IMAGE_PATHS='usr/libexec/couchliteos-hwdetect$ etc/systemd/system/sysinit\.target\.wants/couchliteos-hwdetect-early\.service$ lib/modules/[^/]+/updates/dkms/nvidia-current\.ko(\.xz|\.zst)?$ lib/modules/[^/]+/updates/dkms/nvidia-current-drm\.ko(\.xz|\.zst)?$ lib/modules/[^/]+/updates/dkms/nvidia-current-modeset\.ko(\.xz|\.zst)?$ usr/lib/firmware/nvidia/550\.[0-9.]+/gsp_ga10x\.bin$ usr/lib/x86_64-linux-gnu/gbm/nvidia-drm_gbm\.so$ usr/share/glvnd/egl_vendor\.d/10_nvidia\.json$ usr/share/nvidia/nvidia\.ids$ etc/modprobe\.d/couchliteos-nvidia\.conf$ etc/nvidia/current/nvidia-load\.conf\.couchliteos-disabled$ usr/lib/x86_64-linux-gnu/dri/iHD_drv_video\.so$ usr/lib/x86_64-linux-gnu/dri/radeonsi_drv_video\.so$ lib/modules/[^/]+/updates/dkms/wl\.ko(\.xz|\.zst)?$ usr/bin/sdl-freerdp3$ usr/sbin/dmidecode$'
# 0900-slim.hook.chroot: documentation, translations, the LTO compiler, sanitizers, ARM SoC firmware.
FORBIDDEN_IMAGE_PATHS='etc/modprobe\.d/broadcom-sta-dkms\.conf$ var/lib/dkms/mok\.key$ ^/+usr/share/man/. ^/+usr/share/info/. ^/+usr/share/doc/[^/]+/changelog ^/+usr/share/locale/([^e/]|e[^n/])[^/]*/ ^/+usr/(lib|libexec)/gcc/.*/lto1$ ^/+usr/lib/(gcc/.*|x86_64-linux-gnu)/lib(asan|tsan|lsan|ubsan|hwasan)[^/]*$ ^/+usr/lib/firmware/ath1[0-2]k/(QCA4019|WCN3990|WCN6750|IPQ[0-9]+)/ ^/+usr/lib/firmware/(imx|meson|rockchip|qcom)/ ^/+usr/lib/firmware/mediatek/(.*mt8[0-9]{3}|mt7622|mt7629|mt798[0-9]) usr/bin/firefox-esr$ usr/bin/google-chrome-stable$'
