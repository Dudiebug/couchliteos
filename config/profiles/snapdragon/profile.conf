# CouchLiteOS build profile: snapdragon (arm64 live ISO for the Microsoft Surface Laptop 7,
# Snapdragon X, 13.8 and 15 inch). The kernel is our linux-image-7.3.0-sl7 (kernel/sl7),
# fetched from its release by packages.lock; GRUB loads the laptop's device tree
# (0300-devicetree.hook.binary). Live and persistence only: Debian's installer boots
# Debian's own arm64 kernel, which has no driver for this laptop's keyboard or touchpad.
# Secure Boot has to be off: the kernel is unsigned, and GRUB in lockdown refuses devicetree.
# Sourced by build/configure.sh and build/build.sh; installed as
# /usr/share/couchliteos/profile.conf for diagnostics.
PROFILE_NAME=snapdragon
PROFILE_DESCRIPTION="Snapdragon X: Microsoft Surface Laptop 7 (13.8 and 15 inch), arm64"
ISO_SUFFIX=snapdragon
# Not a release asset until it has been tested on the laptop.
RELEASE=0
NVIDIA_DRIVER=none
ARCH=arm64
# X1E80100 laptops boot with the clocks and power domains the firmware left on: the
# kernel would otherwise switch off what the display and USB still use before their
# drivers (modules) load.
KERNEL_ARGS='clk_ignore_unused pd_ignore_unused'
# --linux-flavours 7.3.0-sl7 makes live-build install linux-image-7.3.0-sl7 (the deb in
# packages.chroot) instead of Debian's linux-image-arm64. Firmware comes from the profile's
# package list, as on the release profiles.
LB_EXTRA_CONFIG='--linux-flavours 7.3.0-sl7 --bootloaders grub-efi --uefi-secure-boot disable --debian-installer none --firmware-binary false --firmware-chroot false'
# Post-build checks against the final root filesystem listing (extended regexes).
REQUIRED_IMAGE_PATHS='boot/vmlinuz-7\.3\.0-sl7$ usr/lib/linux-image-7\.3\.0-sl7/qcom/x1e80100-microsoft-romulus13-spi-touch\.dtb$ usr/lib/linux-image-7\.3\.0-sl7/qcom/x1e80100-microsoft-romulus13\.dtb$ usr/lib/linux-image-7\.3\.0-sl7/qcom/x1e80100-microsoft-romulus15\.dtb$ lib/modules/7\.3\.0-sl7/kernel/drivers/hid/spi-hid/spi-hid\.ko lib/modules/7\.3\.0-sl7/kernel/drivers/platform/surface/aggregator/surface_aggregator\.ko usr/lib/firmware/qcom/gen70500_sqe\.fw$ usr/lib/firmware/qcom/x1e80100/X1E80100-Romulus-tplg\.bin$ usr/lib/firmware/ath12k/WCN7850/hw2\.0/amss\.bin$ usr/lib/aarch64-linux-gnu/dri/msm_dri\.so$ usr/bin/sdl-freerdp3$ usr/bin/msiextract$ usr/libexec/couchliteos-sl7-wifi-board$ etc/systemd/system/sysinit\.target\.wants/couchliteos-sl7-wifi-board\.service$ opt/couchliteos/apps/chiaki-ng/usr/bin/chiaki$'
# Microsoft's and Qualcomm's signed firmware for this laptop is not redistributable: it is
# copied from Windows on the laptop, never shipped. No x86 code, no Google Chrome (amd64 only).
FORBIDDEN_IMAGE_PATHS='usr/lib/firmware/(updates/)?qcom/x1e80100/microsoft/ x86_64-linux-gnu/ usr/bin/google-chrome-stable$ etc/apt/sources\.list\.d/google-chrome\.list$ /nvidia(-current)?(-drm|-modeset|-uvm|-peermem)?\.ko(\.xz|\.zst)?$ ^/+usr/share/man/. ^/+usr/share/info/. ^/+usr/share/doc/[^/]+/changelog ^/+usr/share/locale/([^e/]|e[^n/])[^/]*/'
