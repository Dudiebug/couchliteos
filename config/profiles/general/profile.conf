# CouchLiteOS build profile: general (release ISO for most PCs and Intel Macs).
# Intel, AMD, and NVIDIA graphics through the open kernel drivers and Mesa
# (i915/xe, amdgpu/radeon, nouveau). couchliteos-hwdetect picks per-machine
# module policy at boot. Sourced by build/configure.sh and build/build.sh;
# installed as /usr/share/couchliteos/profile.conf for diagnostics.
PROFILE_NAME=general
PROFILE_DESCRIPTION="General: Intel, AMD, and NVIDIA (nouveau) graphics, Intel Macs"
# Empty keeps the main ISO name: couchliteos-<version>-amd64.iso
ISO_SUFFIX=
# Release profiles are the assets of a GitHub release (tools/release-assets.sh).
RELEASE=1
# none: the build fails if a proprietary NVIDIA package or module is present.
NVIDIA_DRIVER=none
# Firmware comes from the curated package list instead of live-build's
# install-everything default (which adds server, ARM SoC, and NVIDIA GSP
# firmware and pushes the ISO past GitHub's 2 GiB release-asset limit).
LB_EXTRA_CONFIG='--firmware-binary false --firmware-chroot false'
# Post-build checks against the final root filesystem listing (extended regexes).
REQUIRED_IMAGE_PATHS='usr/libexec/couchliteos-hwdetect$ etc/systemd/system/sysinit\.target\.wants/couchliteos-hwdetect-early\.service$ usr/lib/x86_64-linux-gnu/dri/iHD_drv_video\.so$ usr/lib/x86_64-linux-gnu/dri/i965_drv_video\.so$ usr/lib/x86_64-linux-gnu/dri/radeonsi_drv_video\.so$ usr/lib/firmware/i915/ usr/lib/firmware/amdgpu/ usr/lib/firmware/nvidia/ lib/modules/[^/]+/updates/dkms/wl\.ko(\.xz|\.zst)?$ usr/share/broadcom-sta/broadcom-sta\.ids$ etc/modprobe\.d/broadcom-sta-dkms\.conf\.couchliteos-disabled$ usr/lib/firmware/tigon/tg357766\.bin$ usr/bin/sdl-freerdp3$ usr/sbin/dmidecode$'
# 0900-slim.hook.chroot: documentation, translations, the LTO compiler, sanitizers, ARM SoC firmware.
FORBIDDEN_IMAGE_PATHS='/nvidia(-current)?(-drm|-modeset|-uvm|-peermem)?\.ko(\.xz|\.zst)?$ usr/lib/x86_64-linux-gnu/libnvidia- usr/lib/firmware/nvidia/[0-9.]+/gsp etc/modprobe\.d/broadcom-sta-dkms\.conf$ var/lib/dkms/mok\.key$ ^/+usr/share/man/. ^/+usr/share/info/. ^/+usr/share/doc/[^/]+/changelog ^/+usr/share/locale/([^e/]|e[^n/])[^/]*/ ^/+usr/(lib|libexec)/gcc/.*/lto1$ ^/+usr/lib/(gcc/.*|x86_64-linux-gnu)/lib(asan|tsan|lsan|ubsan|hwasan)[^/]*$ ^/+usr/lib/firmware/ath1[0-2]k/(QCA4019|WCN3990|WCN6750|IPQ[0-9]+)/ ^/+usr/lib/firmware/(imx|meson|rockchip|qcom)/ ^/+usr/lib/firmware/mediatek/(.*mt8[0-9]{3}|mt7622|mt7629|mt798[0-9]) usr/bin/firefox-esr$ usr/bin/google-chrome-stable$'
