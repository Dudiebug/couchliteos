# CouchLiteOS imac2013 profile.
# The Broadcom STA driver (wl) owns the BCM4360; the open drivers conflict with it.
blacklist b43
blacklist b43legacy
blacklist bcma
blacklist ssb
blacklist brcmsmac
blacklist brcm80211
# Apple keyboards: F1-F12 act as function keys (Fn selects the media keys).
options hid_apple fnmode=2
# Never load a proprietary NVIDIA module; Kepler must use nouveau for KMS and GBM.
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
