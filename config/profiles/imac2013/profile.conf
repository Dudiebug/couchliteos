# MoonlightOS build profile: Apple iMac Late 2013 (iMac14,2 27-inch / iMac14,3 21.5-inch).
# NVIDIA Kepler (GT 750M / GT 755M / GTX 775M / GTX 780M) through nouveau and Mesa
# only. The proprietary driver stops at the 470 legacy branch, which has no GBM,
# so Cage/wlroots cannot run on it; never add it to this profile.
PROFILE_NAME=imac2013
PROFILE_DESCRIPTION="Apple iMac Late 2013 (iMac14,2 / iMac14,3, NVIDIA Kepler via nouveau)"
# Legacy single-machine profile: the general ISO now covers this machine.
ISO_SUFFIX=imac2013
RELEASE=0
NVIDIA_DRIVER=none
# Firmware comes from the curated package list instead of live-build's
# install-everything default, which would add NVIDIA's proprietary-driver GSP
# firmware and push the ISO past GitHub's 2 GiB release-asset limit.
LB_EXTRA_CONFIG='--firmware-binary false --firmware-chroot false'
REQUIRED_IMAGE_PATHS='lib/modules/[^/]+/updates/dkms/wl\.ko(\.xz|\.zst)?$ usr/lib/firmware/tigon/tg357766\.bin$ etc/modprobe\.d/moonlightos-imac2013\.conf$ usr/bin/sdl-freerdp3$ usr/sbin/dmidecode$'
FORBIDDEN_IMAGE_PATHS='/nvidia(-drm|-modeset|-uvm|-peermem)?\.ko(\.xz|\.zst)?$ usr/lib/x86_64-linux-gnu/libnvidia- usr/lib/firmware/nvidia/[0-9.]+/gsp usr/lib/x86_64-linux-gnu/dri/iHD_drv_video\.so$ var/lib/dkms/mok\.key$'
