# CouchLiteOS build profile: Dell OptiPlex 7010 Micro DCC36X3 (Intel UHD 770).
# Sourced by build/configure.sh and build/build.sh; installed as
# /usr/share/couchliteos/profile.conf for diagnostics.
PROFILE_NAME=intel
PROFILE_DESCRIPTION="Dell OptiPlex 7010 Micro DCC36X3 (Intel UHD 770)"
# Legacy single-machine profile: the general ISO now covers this machine.
ISO_SUFFIX=intel
RELEASE=0
NVIDIA_DRIVER=none
# Extra `lb config` options. The live system still receives every firmware
# package; only the duplicate firmware .debs for the text installer are left
# out of the ISO so it stays under GitHub's 2 GiB release-asset limit.
LB_EXTRA_CONFIG='--firmware-binary false'
# Post-build checks against the final root filesystem listing (extended regexes).
REQUIRED_IMAGE_PATHS='usr/lib/x86_64-linux-gnu/dri/iHD_drv_video\.so$ usr/bin/sdl-freerdp3$'
FORBIDDEN_IMAGE_PATHS='/nvidia(-drm|-modeset|-uvm|-peermem)?\.ko(\.xz|\.zst)?$ usr/lib/x86_64-linux-gnu/libnvidia-'
