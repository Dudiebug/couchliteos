# MoonlightOS build profile: Dell OptiPlex 7010 Micro DCC36X3 (Intel UHD 770).
# Sourced by build/configure.sh and build/build.sh; installed as
# /usr/share/moonlightos/profile.conf for diagnostics.
PROFILE_NAME=intel
PROFILE_DESCRIPTION="Dell OptiPlex 7010 Micro DCC36X3 (Intel UHD 770)"
# Empty keeps the historical ISO name: moonlightos-<version>-amd64.iso
ISO_SUFFIX=
# Post-build checks against the final root filesystem listing (extended regexes).
REQUIRED_IMAGE_PATHS='usr/lib/x86_64-linux-gnu/dri/iHD_drv_video\.so$'
FORBIDDEN_IMAGE_PATHS='/nvidia[^/]*\.ko(\.xz|\.zst)?$'
