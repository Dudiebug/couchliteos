# CouchLiteOS: the boot splash (overlay/usr/share/plymouth/themes/couchliteos, drawn by
# tools/make-logo.py). It shows from the initrd until the TV interface takes over the screen;
# Esc shows the boot messages behind it. DeviceTimeout is Debian's: how long Plymouth waits for
# the graphics driver before it settles for the firmware's framebuffer.
[Daemon]
Theme=couchliteos
ShowDelay=0
DeviceTimeout=8
