# Bluetooth audio.
#
# A headset's headset (HFP/HSP) mode has a mic but plays in low quality, so it is
# used only while something records from the headset chosen in Settings > AUDIO >
# MICROPHONE. couchliteos_audio.Watcher (run by couchliteos-audio) makes that switch
# and moves the sound to a Bluetooth device when it connects; WirePlumber's own
# switch is turned off so the two never fight over the profile.
#
# SBC-XQ is a higher quality SBC mode most headphones accept. Absolute volume
# (AVRCP) keeps the headphone buttons and the volume in Settings in step.
#
# Syntax: WirePlumber 0.5 (Debian 13).
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
}
