# Sound follows the TV.
#
# WirePlumber picks the default output from the highest priority.session among
# sinks that have an available route. A plain ALSA analog sink scores 1009 and a
# Bluetooth sink 1010, while HDMI/DisplayPort PCMs score about 700. Raise
# HDMI/DisplayPort sinks above both. Sink names are lowercase without UCM
# (hdmi-stereo) and uppercase with it (HiFi__HDMI1__sink), so both are matched.
# An HDMI/DP output with no TV connected (no valid ELD on the jack) has no
# available route and is never chosen as the default, so sound stays on the
# next sink until a TV appears. An output the user picked (Settings > Audio, or
# "use for audio" in Bluetooth) is stored by WirePlumber as the configured
# default and keeps winning while that sink exists.
#
# This only ranks sinks that exist. On plain HDA cards the HDMI/DP sink exists
# only under an HDMI card profile; 51-couchliteos-tv-profile.conf selects it.
#
# Syntax: WirePlumber 0.5 (Debian 13). "~" values are regular expressions; the
# keys of one match object must all match. The alsa monitor applies these rules
# after it has set media.class, node.name and node.description.
monitor.alsa.rules = [
  {
    matches = [
      {
        media.class = "Audio/Sink"
        node.name = "~.*hdmi.*"
      }
      {
        media.class = "Audio/Sink"
        node.name = "~.*HDMI.*"
      }
      {
        media.class = "Audio/Sink"
        node.description = "~.*HDMI.*"
      }
      {
        media.class = "Audio/Sink"
        node.description = "~.*DisplayPort.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1100
      }
    }
  }
]
