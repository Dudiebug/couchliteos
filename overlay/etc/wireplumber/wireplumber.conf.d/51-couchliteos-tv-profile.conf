# Sound follows the TV, part 2: the card profile.
#
# 50-couchliteos-hdmi-default.conf ranks HDMI/DP sinks first, but on a plain HDA
# card (most Intel and AMD desktops) the HDMI/DP sink only exists while the
# card's profile is an HDMI one, and WirePlumber keeps such cards on analog.
# couchliteos/find-tv-profile.lua (installed in /usr/share/wireplumber/scripts)
# selects an HDMI/DP profile whose jack has a TV attached. See the script.
#
# Optional: if the script cannot load, WirePlumber still starts and sound keeps
# working, only without this preference.
#
# Syntax: WirePlumber 0.5 (Debian 13). main-systemwide inherits main.
wireplumber.components = [
  {
    name = couchliteos/find-tv-profile.lua, type = script/lua
    provides = hooks.device.profile.couchliteos-find-tv
  }
]

wireplumber.profiles = {
  main = {
    hooks.device.profile.couchliteos-find-tv = optional
  }
}
