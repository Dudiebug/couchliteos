d /run/couchliteos 0700 couchliteos couchliteos -
d /var/log/couchliteos 0750 couchliteos couchliteos -
d /var/lib/couchliteos 0750 couchliteos couchliteos -
d /var/lib/couchliteos/apps 0755 root root -
d /var/cache/couchliteos 0755 root root -
d /var/lib/tailscale 0700 root root -
# Root's own: the updater's and browser tool's work and locks, their logs, the saved previous
# version. Never below the couchliteos user's directories, where that user could swap entries.
d /run/couchliteos-update 0700 root root -
d /var/log/couchliteos-update 0755 root root -
d /var/lib/couchliteos-update 0755 root root -
