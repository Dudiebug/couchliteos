GRUB_CMDLINE_LINUX_DEFAULT="quiet ipv6.disable=1"
# Installed systems only (the live ISO has its own menu, built by the binary hook).
# Boot straight into CouchLiteOS when the previous boot reached the launcher: the menu is
# hidden for 3 s (hold Shift on BIOS or press Esc on UEFI to show it). After a failed boot,
# and on the first boot after install, /etc/grub.d/01_couchliteos_bootcheck shows the menu
# for 5 s instead.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=3
