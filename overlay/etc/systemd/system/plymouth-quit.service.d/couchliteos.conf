# CouchLiteOS: couchliteos-launcher.service quits the boot splash itself and keeps its last
# picture on the screen until the TV interface draws the same one. Debian's plymouth-quit
# would otherwise race it and could blank the screen to text first, so it waits for the
# launcher (by then Plymouth is gone and it has nothing left to do).
[Unit]
After=couchliteos-launcher.service
