# The CouchLiteOS Snapdragon X kernel: upstream linux-$KERNEL_VERSION from kernel.org,
# Debian's arm64 config, the Surface Laptop 7 patch series in patches/ and
# config.fragment. Sourced by build.sh and the kernel-arm64 workflow.
KERNEL_VERSION=7.3
# From https://cdn.kernel.org/pub/linux/kernel/v7.x/sha256sums.asc
KERNEL_SHA256=87363c24f10e06321eb362765521094e94471f6bff8bce2d6b3e40f39f004953
# Bump for a new patch set or config on the same kernel: linux-image-<ver>-sl7_<ver>-<rev>~couchliteos
PKG_REVISION=1
# Debian release whose arm64 kernel config is the base (its backports kernel).
DEBIAN_BASE=trixie
