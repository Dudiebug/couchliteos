[app]
id = steam
name = STEAM
kind = command
command = /usr/bin/steam
arguments = -tenfoot
terminal = false
enabled = true
visible = true
order = 50
return_to_launcher = true

# Steam is not installed in CouchLiteOS v0.1.11. This example becomes usable
# only after a future supported installation method exists. It makes no claim
# about Steam accounts, runtime updates, game storage, or multilib. Steam Input
# is not applied globally to Moonlight or Chiaki-ng.
