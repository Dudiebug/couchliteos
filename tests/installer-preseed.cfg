# Test-only credentials are written only to the disposable QEMU disk.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/enable boolean false
d-i netcfg/get_hostname string couchliteos
d-i netcfg/get_domain string local
d-i clock-setup/utc boolean true
d-i time/zone string UTC
# The image's own preseed (config/live-build/includes.installer/preseed.cfg) skips the
# account questions; the update check needs a second, sudo-capable login to prove accounts
# survive an update, so the test adds it after the install.
# The same account answers as the ISO's own preseed (includes.installer/preseed.cfg): older ISOs
# (tests/qemu-legacy-smoke.sh installs 0.2.0) do not have them and would stop at the question.
d-i passwd/make-user boolean false
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password *
d-i preseed/late_command string in-target sh -c 'id installer-test >/dev/null 2>&1 || useradd --uid 1001 --create-home --groups sudo --shell /bin/bash --comment "Installer Test" installer-test; echo installer-test:installer-test | chpasswd'
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/vda
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i apt-setup/use_mirror boolean false
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda
d-i debian-installer/add-kernel-opts string console=tty1 console=ttyS0,115200n8
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean false
