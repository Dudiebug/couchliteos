name: build-and-smoke-test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl ca-certificates cpio debootstrap \
            debian-archive-keyring e2fsprogs xorriso squashfs-tools grub-pc-bin \
            grub-efi-amd64-bin mtools dosfstools qemu-system-x86 ovmf ripgrep
          curl --fail --location --output /tmp/live-build.deb \
            https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb
          sudo apt-get install --yes /tmp/live-build.deb
          lb --version
      - name: Enable QEMU acceleration
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          fi
      - name: Source tests
        run: make test
      - name: Build ISO
        run: |
          sudo make build
          sudo chown -R "$(id -u):$(id -g)" build/out
      - name: Final release gauntlet
        run: make release-gauntlet
        env:
          MOONLIGHTOS_QEMU_LOG: /tmp/moonlightos-qemu-smoke.log
          MOONLIGHTOS_QEMU_SCREENSHOT: /tmp/moonlightos-qemu-smoke.ppm
          MOONLIGHTOS_QEMU_INSTALL_LOG: /tmp/moonlightos-qemu-install.log
          MOONLIGHTOS_QEMU_INSTALLED_BOOT_LOG: /tmp/moonlightos-qemu-installed-boot.log
          MOONLIGHTOS_QEMU_INSTALL_MENU_SCREENSHOT: /tmp/moonlightos-qemu-install-menu.ppm
          MOONLIGHTOS_QEMU_INSTALL_EDITOR_SCREENSHOT: /tmp/moonlightos-qemu-install-editor.ppm
          MOONLIGHTOS_QEMU_INSTALLER_SCREENSHOT: /tmp/moonlightos-qemu-installer.ppm
          MOONLIGHTOS_QEMU_INSTALLED_SCREENSHOT: /tmp/moonlightos-qemu-installed-launcher.ppm
          MOONLIGHTOS_QEMU_INSTALL_CONFIG: /tmp/moonlightos-qemu-install-config.log
          MOONLIGHTOS_QEMU_PERSISTENCE_LOG: /tmp/moonlightos-qemu-persistence.log
      - name: Upload failed boot diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: moonlightos-failed-boot-${{ github.run_id }}
          path: |
            /tmp/moonlightos-qemu-smoke.log
            /tmp/moonlightos-qemu-smoke.ppm
            /tmp/moonlightos-qemu-install.log
            /tmp/moonlightos-qemu-installed-boot.log
            /tmp/moonlightos-qemu-install-menu.ppm
            /tmp/moonlightos-qemu-install-editor.ppm
            /tmp/moonlightos-qemu-installer.ppm
            /tmp/moonlightos-qemu-installed-launcher.ppm
            /tmp/moonlightos-qemu-install-config.log
            /tmp/moonlightos-qemu-persistence.log
          if-no-files-found: warn
          retention-days: 2
      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: moonlightos-0.1.13-amd64
          path: build/out/moonlightos-0.1.13-amd64.iso
          if-no-files-found: error
      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: moonlightos-0.1.13-evidence
          path: |
            /tmp/moonlightos-qemu-smoke.log
            /tmp/moonlightos-qemu-smoke.ppm
            /tmp/moonlightos-qemu-install.log
            /tmp/moonlightos-qemu-installed-boot.log
            /tmp/moonlightos-qemu-install-menu.ppm
            /tmp/moonlightos-qemu-install-editor.ppm
            /tmp/moonlightos-qemu-installer.ppm
            /tmp/moonlightos-qemu-installed-launcher.ppm
            /tmp/moonlightos-qemu-install-config.log
            /tmp/moonlightos-qemu-persistence.log
          if-no-files-found: error
          retention-days: 30
